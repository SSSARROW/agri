<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Batch Provenance{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --green: #1B5E20;
    --green-bg: #E8F5E9;
    --amber: #7C5C00;
    --amber-bg: #FFF3CD;
    --red: #B71C1C;
    --red-bg: #FDECEA;
    --ink: #1a1a1a;
    --muted: #5f6368;
    --border: #e2e2e2;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fafaf8;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: 0.02em; }
  h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .muted { color: var(--muted); }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
  }
  details.card { padding: 0; }
  details.card summary {
    cursor: pointer;
    list-style: none;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  details.card summary::-webkit-details-marker { display: none; }
  .summary-title { font-weight: 700; font-size: 1.05rem; }
  .summary-sub { font-size: 0.82rem; white-space: nowrap; }
  details.card summary::after {
    content: '▾';
    color: var(--muted);
    flex-shrink: 0;
    transition: transform 0.15s ease;
  }
  details.card[open] summary::after { transform: rotate(180deg); }
  .details-body { padding: 0 16px 16px; }
  .badge {
    display: block;
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1rem;
  }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge p { font-weight: 400; font-size: 0.85rem; margin: 6px 0 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--muted); }
  .stage { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .stage:last-child { border-bottom: none; }
  .stage-title { font-weight: 700; font-size: 0.95rem; }
  .stage-status { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
  .status-done { color: var(--green); }
  .status-overdue { color: var(--red); }
  .status-upcoming, .status-pending { color: var(--amber); }
  .status-standing { color: var(--muted); }
  .stage-instructions { font-size: 0.88rem; color: #333; margin-top: 4px; }
  .timeline-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-type { font-weight: 700; text-transform: capitalize; }
  .timeline-meta { color: var(--muted); font-size: 0.82rem; }
  .timeline-caption { font-size: 0.88rem; margin-top: 4px; }
  .timeline-photo { display: block; max-width: 220px; width: 100%; border-radius: 10px; margin-top: 8px; border: 1px solid var(--border); }
  .timeline-flag { color: var(--amber); font-size: 0.78rem; margin-top: 4px; }
  .source-cite { font-size: 0.78rem; color: var(--muted); margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; }
  footer { text-align: center; color: var(--muted); font-size: 0.75rem; margin-top: 28px; }
</style>
</head>
<body>
<main>
{% block content %}{% endblock %}
<footer>
  Generated from records in the Agri traceability system. This page reflects data entered by farmers, collectors and processors — the platform verifies internal consistency of that data, not the truth of what was physically done.
</footer>
</main>
</body>
</html>
